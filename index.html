<title>Ragıp & Nusret · Büyüme</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg:#0f0f1a;--surface:#16162a;--card:#1e1e35;--card2:#232340;
  --ragip:#f4a261;--ragip-dim:rgba(244,162,97,0.15);
  --nusret:#48cae4;--nusret-dim:rgba(72,202,228,0.15);
  --text:#e8e8f0;--muted:#7070a0;--border:rgba(255,255,255,0.07);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);min-height:100dvh;overscroll-behavior:none}
.header{padding:52px 20px 16px;background:linear-gradient(180deg,rgba(244,162,97,0.08) 0%,transparent 100%);border-bottom:1px solid var(--border)}
.header h1{font-family:'DM Serif Display',serif;font-size:26px;letter-spacing:-.5px;background:linear-gradient(135deg,var(--ragip),var(--nusret));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header p{font-size:12px;color:var(--muted);margin-top:3px}
.child-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface)}
.child-tab{flex:1;padding:14px;text-align:center;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);border:none;background:none;font-family:'DM Sans',sans-serif;transition:all .2s;position:relative}
.child-tab::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;border-radius:2px 2px 0 0;opacity:0;transition:opacity .2s}
.child-tab.ragip.active{color:var(--ragip)}.child-tab.ragip::after{background:var(--ragip)}
.child-tab.nusret.active{color:var(--nusret)}.child-tab.nusret::after{background:var(--nusret)}
.child-tab.active::after{opacity:1}
.main{padding:0 0 120px}
.metric-tabs{display:flex;gap:8px;padding:16px 16px 0}
.metric-tab{flex:1;padding:10px 8px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;text-align:center}
.metric-tab.active-ragip{background:var(--ragip-dim);border-color:var(--ragip);color:var(--ragip)}
.metric-tab.active-nusret{background:var(--nusret-dim);border-color:var(--nusret);color:var(--nusret)}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:14px 16px}
.stat-card{background:var(--card);border-radius:14px;padding:14px 12px;border:1px solid var(--border);text-align:center}
.stat-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.stat-value{font-family:'DM Serif Display',serif;font-size:22px;letter-spacing:-.5px}
.stat-value.ragip-c{color:var(--ragip)}.stat-value.nusret-c{color:var(--nusret)}
.stat-sub{font-size:10px;color:var(--muted);margin-top:3px}
.pct-badge{display:inline-block;margin-top:5px;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600}
.pct-badge.ragip-c{background:var(--ragip-dim);color:var(--ragip)}
.pct-badge.nusret-c{background:var(--nusret-dim);color:var(--nusret)}

/* Projection card */
.projection-card{margin:0 16px 4px;background:var(--card);border-radius:14px;border:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:12px}
.projection-icon{font-size:22px;flex-shrink:0}
.projection-body{flex:1}
.projection-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.projection-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.projection-val{font-family:'DM Serif Display',serif;font-size:20px;letter-spacing:-.3px}
.projection-val.ragip-c{color:var(--ragip)}.projection-val.nusret-c{color:var(--nusret)}
.projection-sep{color:var(--muted);font-size:12px}
.projection-sub{font-size:11px;color:var(--muted)}

.chart-card{margin:0 16px 4px;background:var(--card);border-radius:18px;border:1px solid var(--border);padding:16px}
.chart-wrap{position:relative;height:260px}
.add-section{margin:0 16px 14px;background:var(--card);border-radius:18px;border:1px solid var(--border);padding:16px}
.add-section h3{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px}
.input-row{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;margin-bottom:12px}
.input-group label{display:block;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.input-group input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:10px;color:var(--text);font-size:15px;font-family:'DM Sans',sans-serif;font-weight:500;-webkit-appearance:none;appearance:none;transition:border-color .2s}
.input-group input:focus{outline:none}
.rf:focus{border-color:var(--ragip)!important}.nf:focus{border-color:var(--nusret)!important}
.btn-add{width:100%;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-add.rb{background:var(--ragip);color:#1a0a00}.btn-add.nb{background:var(--nusret);color:#00111a}
.btn-add:active{transform:scale(.97);opacity:.9}.btn-add:disabled{opacity:.5;pointer-events:none}
.history-section{margin:0 16px}
.history-section h3{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;padding:0 2px}
.history-list{display:flex;flex-direction:column;gap:8px}
.history-item{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:12px 14px;display:grid;grid-template-columns:1fr auto 28px;gap:8px;align-items:center}
.history-date{font-size:13px;font-weight:500;color:var(--text)}
.history-age{font-size:11px;color:var(--muted);margin-top:2px}
.history-val{font-size:13px;font-weight:600;text-align:right}
.history-val.ragip-c{color:var(--ragip)}.history-val.nusret-c{color:var(--nusret)}
.btn-del{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px;border-radius:6px;line-height:1}
.btn-del:active{color:#ff6b6b}
.empty-state{text-align:center;color:var(--muted);font-size:13px;padding:20px}
.sync-bar{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 16px;font-size:11px;color:var(--muted);min-height:28px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);transition:background .3s}
.sync-dot.syncing{background:#f4d03f;animation:pulse 1s infinite}
.sync-dot.ok{background:#58d68d}.sync-dot.err{background:#e74c3c}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spinner{width:14px;height:14px;border:2px solid rgba(0,0,0,.2);border-top-color:currentColor;border-radius:50%;animation:spin .6s linear infinite;display:none}
.spinner.v{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.bottom-safe{height:env(safe-area-inset-bottom,16px)}

// ── Yardımcılar ──────────────────────────────────────────
function parseDate(s){
  if(!s)return null;
  s=String(s);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
  if(/^\d{2}\.\d{2}\.\d{4}$/.test(s)){const[d,m,y]=s.split('.').map(Number);return new Date(y,m-1,d);}
  const d=new Date(s);return isNaN(d)?null:d;
}
function ageMonthsDays(dob, date) {
  const d1=parseDate(dob), d2=parseDate(date);
  if(!d1||!d2||d2<d1) return null;
  let y=d2.getFullYear()-d1.getFullYear();
  let m=d2.getMonth()-d1.getMonth();
  let d=d2.getDate()-d1.getDate();
  if(d<0){
    m--;
    const prevMonth=new Date(d2.getFullYear(),d2.getMonth(),0);
    d+=prevMonth.getDate();
  }
  if(m<0){y--;m+=12;}
  return {y,m,d};
}
function ageMonths(dob,date){
  const a=ageMonthsDays(dob,date);
  if(!a)return null;
  return a.y*12+a.m;
}
function fmtAge(months){ // fallback, artık direkt ageMonthsDays kullanıyoruz
  const y=Math.floor(months/12),r=months%12;
  return y===0?r+' ay':r===0?y+' yıl':y+' yıl '+r+' ay';
}
function fmtAgeFull(dob, date){
  const a=ageMonthsDays(dob,date);
  if(!a) return '—';
  const parts=[];
  if(a.y>0) parts.push(a.y+' yıl');
  if(a.m>0) parts.push(a.m+' ay');
  if(a.d>0) parts.push(a.d+' gün');
  return parts.length?parts.join(' '):'0 gün';
}
function fmtDate(iso){
  if(!iso)return '—';
  let d;
  if(/^\d{4}-\d{2}-\d{2}$/.test(String(iso))){
    const [y,m,day]=String(iso).split('-').map(Number);
    d=new Date(y,m-1,day);
  } else if(/^\d{2}\.\d{2}\.\d{4}$/.test(String(iso))){
    const [day,m,y]=String(iso).split('.').map(Number);
    d=new Date(y,m-1,day);
  } else {
    d=new Date(iso);
  }
  if(isNaN(d))return String(iso);
  return d.toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'numeric'});
}

// Değer → persentil (0-100 arası kayan sayı)
function valueToPct(table, pcts, ageM, value){
  const row = interpolateRow(table, ageM);
  const vals = row.slice(1);
  if(value<=vals[0])return pcts[0];
  if(value>=vals[6])return pcts[6];
  for(let i=0;i<6;i++){
    if(value>=vals[i]&&value<=vals[i+1])
      return pcts[i]+(value-vals[i])/(vals[i+1]-vals[i])*(pcts[i+1]-pcts[i]);
  }
  return 50;
}

// Persentil → değer (ters yön)
function pctToValue(table, pcts, ageM, pct){
  const row = interpolateRow(table, ageM);
  const vals = row.slice(1);
  if(pct<=pcts[0])return vals[0];
  if(pct>=pcts[6])return vals[6];
  for(let i=0;i<6;i++){
    if(pct>=pcts[i]&&pct<=pcts[i+1])
      return vals[i]+(pct-pcts[i])/(pcts[i+1]-pcts[i])*(vals[i+1]-vals[i]);
  }
  return vals[3];
}

function interpolateRow(table, ageM){
  let lo=0,hi=table.length-1;
  for(let i=0;i<table.length;i++){if(table[i][0]<=ageM)lo=i;}
  for(let i=0;i<table.length;i++){if(table[i][0]>=ageM){hi=i;break;}}
  if(lo===hi)return table[lo];
  const t=(ageM-table[lo][0])/(table[hi][0]-table[lo][0]);
  return table[lo].map((v,i)=>i===0?ageM:v+t*(table[hi][i]-v));
}

function setSyncState(s,t){
  document.getElementById('syncDot').className='sync-dot '+s;
  document.getElementById('syncText').textContent=t;
}
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

// ── API ──────────────────────────────────────────────────
async function fetchChild(cn){
  setSyncState('syncing','Yükleniyor…');
  try{
    const res=await fetch(`${API}?child=${cn}`);
    const data=await res.json();
    cache[cn]=data.map(r=>({date:r.date,height:r.height?parseFloat(r.height):null,weight:r.weight?parseFloat(r.weight):null})).filter(r=>r.date);
    setSyncState('ok','Senkronize');
  }catch(e){
    setSyncState('err','Bağlantı hatası');
    showToast('⚠️ Veri yüklenemedi');
    cache[cn]=cache[cn]||[];
  }
}
async function saveChild(cn){
  setSyncState('syncing','Kaydediliyor…');
  try{
    await fetch(API,{method:'POST',body:JSON.stringify({child:cn,action:'save',data:cache[cn]})});
    setSyncState('ok','Kaydedildi');
  }catch(e){
    setSyncState('err','Kaydetme hatası');
    showToast('⚠️ Kaydedilemedi');
  }
}

// ── UI ───────────────────────────────────────────────────
async function selectChild(cn,el){
  activeChild=cn;
  document.querySelectorAll('.child-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.metric-tab').forEach(t=>{
    t.classList.remove('active-ragip','active-nusret');
    if(t.dataset.metric===activeMetric)t.classList.add('active-'+cn);
  });
  const fc=cn==='ragip'?'rf':'nf';
  document.querySelectorAll('#inputDate,#inputHeight,#inputWeight').forEach(i=>{i.className=fc});
  document.getElementById('addBtn').className='btn-add '+(cn==='ragip'?'rb':'nb');
  if(!cache[cn])await fetchChild(cn);
  render();
}

function selectMetric(metric,el){
  activeMetric=metric;
  document.querySelectorAll('.metric-tab').forEach(t=>t.classList.remove('active-ragip','active-nusret'));
  el.classList.add('active-'+activeChild);
  render();
}

async function addMeasurement(){
  const date=document.getElementById('inputDate').value;
  const height=parseFloat(document.getElementById('inputHeight').value)||null;
  const weight=parseFloat(document.getElementById('inputWeight').value)||null;
  if(!date){showToast('Tarih giriniz');return;}
  if(!height&&!weight){showToast('Boy veya kilo giriniz');return;}
  const btn=document.getElementById('addBtn');
  document.getElementById('addSpinner').classList.add('v');
  document.getElementById('addBtnText').textContent='Kaydediliyor…';
  btn.disabled=true;
  const records=cache[activeChild]||[];
  const ei=records.findIndex(r=>r.date===date);
  if(ei>=0){if(height)records[ei].height=height;if(weight)records[ei].weight=weight;}
  else{records.push({date,height,weight});records.sort((a,b)=>new Date(a.date)-new Date(b.date));}
  cache[activeChild]=records;
  await saveChild(activeChild);
  document.getElementById('inputHeight').value='';
  document.getElementById('inputWeight').value='';
  btn.disabled=false;
  document.getElementById('addSpinner').classList.remove('v');
  document.getElementById('addBtnText').textContent='Kaydet';
  showToast('✓ Ölçüm kaydedildi');
  render();
}

async function deleteMeasurement(idx){
  if(!confirm('Bu ölçümü silmek istiyor musunuz?'))return;
  cache[activeChild].splice(idx,1);
  await saveChild(activeChild);
  showToast('Ölçüm silindi');
  render();
}

function getLastRecord(){
  const records=cache[activeChild]||[];
  return [...records].sort((a,b)=>new Date(b.date)-new Date(a.date))[0]||null;
}

function renderStats(){
  const c=CHILDREN[activeChild];
  const row=document.getElementById('statsRow');
  const last=getLastRecord();
  if(!last){row.innerHTML=`<div class="stat-card" style="grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;padding:20px">Henüz ölçüm yok</div>`;return;}
  const ageM=ageMonths(c.dob,last.date);
  const ageStr=ageM!==null?fmtAgeFull(c.dob,last.date):'—';
  let html=`<div class="stat-card"><div class="stat-label">Yaş</div><div class="stat-value ${c.cls}" style="font-size:17px">${ageStr}</div><div class="stat-sub">${fmtDate(last.date)}</div></div>`;
  if(last.height){
    const pct=ageM!==null?valueToPct(HEIGHT_BOYS,HW_PCTS,ageM,last.height):null;
    html+=`<div class="stat-card"><div class="stat-label">Boy</div><div class="stat-value ${c.cls}">${last.height}</div><div class="stat-sub">cm</div>${pct!==null?`<div class="pct-badge ${c.cls}">${Math.round(pct)}. p</div>`:''}</div>`;
  }else html+=`<div class="stat-card"><div class="stat-label">Boy</div><div class="stat-value" style="color:var(--muted)">—</div></div>`;
  if(last.weight){
    const pct=ageM!==null?valueToPct(WEIGHT_BOYS,HW_PCTS,ageM,last.weight):null;
    let extra='<div class="stat-sub">kg</div>';
    if(last.height&&last.weight){
      const bmi=last.weight/Math.pow(last.height/100,2);
      const bmiPct=ageM!==null?valueToPct(BMI_BOYS,BMI_PCTS,ageM,bmi):null;
      extra=`<div class="stat-sub">VKİ ${bmi.toFixed(1)}${bmiPct!==null?' · '+Math.round(bmiPct)+'.p':''}</div>`;
    }
    html+=`<div class="stat-card"><div class="stat-label">Kilo</div><div class="stat-value ${c.cls}">${last.weight}</div>${extra}${pct!==null?`<div class="pct-badge ${c.cls}">${Math.round(pct)}. p</div>`:''}</div>`;
  }else html+=`<div class="stat-card"><div class="stat-label">Kilo</div><div class="stat-value" style="color:var(--muted)">—</div></div>`;
  row.innerHTML=html;
}

function renderProjection(){
  const c=CHILDREN[activeChild];
  const card=document.getElementById('projectionCard');
  const projRow=document.getElementById('projectionRow');
  const projSub=document.getElementById('projectionSub');

  // Sadece boy/kilo sekmelerinde göster
  if(activeMetric==='bmi'){card.style.display='none';return;}

  const last=getLastRecord();
  if(!last){card.style.display='none';return;}

  const ageM=ageMonths(c.dob,last.date);
  if(ageM===null||ageM>=216){card.style.display='none';return;}

  const isHeight=activeMetric==='height';
  const table=isHeight?HEIGHT_BOYS:WEIGHT_BOYS;
  const unit=isHeight?'cm':'kg';
  const val=isHeight?last.height:last.weight;
  if(!val){card.style.display='none';return;}

  // Mevcut persentil
  const pct=valueToPct(table,HW_PCTS,ageM,val);
  // 18 yaş (216 ay) için bu persentildeki değer
  const projected=pctToValue(table,HW_PCTS,216,pct);

  card.style.display='flex';
  projRow.innerHTML=`
    <span class="projection-val ${c.cls}">${projected.toFixed(1)} ${unit}</span>
    <span class="projection-sep">·</span>
    <span class="projection-sub">${Math.round(pct)}. persentil</span>
  `;
  projSub.textContent=`Şu anki persentil korunursa 18 yaşındaki tahmini ${isHeight?'boy':'kilo'}`;
}

function renderChart(){
  const c=CHILDREN[activeChild],records=cache[activeChild]||[];
  const isBMI=activeMetric==='bmi';
  let table,pcts,pLabels;
  if(isBMI){
    table=BMI_BOYS;pcts=BMI_PCTS;
    pLabels=['5.p','15.p','25.p','50.p','75.p','85.p','95.p'];
    document.getElementById('refNote').textContent='VKİ persentilleri: 5., 15., 25., 50., 75., 85., 95. · Neyzi 2015';
  }else{
    table=activeMetric==='height'?HEIGHT_BOYS:WEIGHT_BOYS;
    pcts=HW_PCTS;pLabels=['3.p','10.p','25.p','50.p','75.p','90.p','97.p'];
    document.getElementById('refNote').textContent='Neyzi O. et al., J Clin Res Pediatr Endocrinol 2015;7(4):280-293';
  }
  const datasets=[];
  [{idx:0,dash:[5,4],w:1,op:.18},{idx:1,dash:[4,3],w:1,op:.25},{idx:2,dash:[2,2],w:1,op:.3},
   {idx:3,dash:[],w:1.5,op:.5},{idx:4,dash:[2,2],w:1,op:.3},{idx:5,dash:[4,3],w:1,op:.25},{idx:6,dash:[5,4],w:1,op:.18}]
  .forEach((pc,i)=>datasets.push({label:pLabels[i],
    data:table.map(r=>({x:r[0],y:r[1+pc.idx]})),
    borderColor:`rgba(255,255,255,${pc.op})`,borderWidth:pc.w,borderDash:pc.dash,
    fill:false,pointRadius:0,tension:.4,order:10+i}));

  const pts=records.map(r=>{
    const ageM=ageMonths(c.dob,r.date);if(ageM===null)return null;
    let y=null;
    if(isBMI&&r.height&&r.weight)y=r.weight/Math.pow(r.height/100,2);
    else if(activeMetric==='height'&&r.height)y=r.height;
    else if(activeMetric==='weight'&&r.weight)y=r.weight;
    return y?{x:ageM,y:Math.round(y*10)/10}:null;
  }).filter(Boolean);

  if(pts.length)datasets.push({label:c.name,data:pts,borderColor:c.color,backgroundColor:c.color+'40',
    borderWidth:2.5,pointRadius:2.5,pointBackgroundColor:c.color,pointBorderColor:'#0f0f1a',
    pointBorderWidth:1,tension:.3,fill:false,order:1});

  if(chartInstance)chartInstance.destroy();
  const ctx=document.getElementById('mainChart').getContext('2d');
  const unit=isBMI?' kg/m²':activeMetric==='height'?' cm':' kg';
  chartInstance=new Chart(ctx,{type:'line',data:{datasets},options:{
    responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
    plugins:{legend:{display:false},tooltip:{
      backgroundColor:'rgba(30,30,53,0.97)',titleColor:'#e8e8f0',bodyColor:'#a0a0c0',
      borderColor:'rgba(255,255,255,0.1)',borderWidth:1,padding:10,
      titleFont:{family:'DM Sans',weight:'600',size:12},bodyFont:{family:'DM Sans',size:12},
      callbacks:{
        title:items=>fmtAge(Math.round(items[0].parsed.x)),
        label:item=>item.dataset.label!==c.name?null:` ${item.parsed.y.toFixed(1)}${unit}`,
        filter:item=>item.dataset.label===c.name
      }
    }},
    scales:{
      x:{type:'linear',min:0,max:216,
        ticks:{callback:v=>v%12===0?v/12+'y':null,maxTicksLimit:20,color:'rgba(255,255,255,0.25)',font:{family:'DM Sans',size:10}},
        grid:{color:'rgba(255,255,255,0.04)'},border:{color:'rgba(255,255,255,0.1)'}},
      y:{ticks:{color:'rgba(255,255,255,0.25)',font:{family:'DM Sans',size:10}},
        grid:{color:'rgba(255,255,255,0.04)'},border:{color:'rgba(255,255,255,0.1)'}}
    }
  }});
}

function renderHistory(){
  const c=CHILDREN[activeChild],records=cache[activeChild]||[];
  const list=document.getElementById('historyList');
  if(!records.length){list.innerHTML='<div class="empty-state">Henüz ölçüm eklenmedi</div>';return;}
  list.innerHTML=[...records].map((r,i)=>({...r,origIdx:i}))
    .sort((a,b)=>new Date(b.date)-new Date(a.date))
    .map(r=>{
      const ageM=ageMonths(c.dob,r.date);
      const parts=[];if(r.height)parts.push(r.height+' cm');if(r.weight)parts.push(r.weight+' kg');
      return `<div class="history-item"><div><div class="history-date">${fmtDate(r.date)}</div><div class="history-age">${fmtAgeFull(c.dob,r.date)}</div></div><div class="history-val ${c.cls}">${parts.join(' · ')}</div><button class="btn-del" onclick="deleteMeasurement(${r.origIdx})">×</button></div>`;
    }).join('');
}

window.addEventListener('DOMContentLoaded',async()=>{
  document.getElementById('inputDate').value=new Date().toISOString().split('T')[0];
  await fetchChild('ragip');
  render();
});
</script>
</body>
